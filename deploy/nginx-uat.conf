events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_max_body_size 50m;
    # Only the local UAT frontend may read this private gateway in a browser.
    map $http_origin $uat_origin {
        default "";
        "http://127.0.0.1:4173" "http://127.0.0.1:4173";
    }
    server {
        listen 8080;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $uat_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept-profile, content-profile, prefer, range, range-unit, x-upsert" always;
        add_header Access-Control-Expose-Headers "Content-Range, Range" always;
        if ($request_method = OPTIONS) { return 204; }
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        location = /__rhi/uat {
            default_type application/json;
            return 200 '{"environment":"rhi-isolated-uat","database":"rhi_uat_20261106","provider_delivery":false}';
        }
        location /auth/v1/ { proxy_pass http://rhi-uat-auth:9999/; }
        location /rest/v1/ { proxy_pass http://rhi-uat-rest:3000/; }
        location /storage/v1/ { proxy_pass http://rhi-uat-storage:5000/; }
        location /functions/v1/ { proxy_pass http://rhi-uat-functions:9000/; }
        location /realtime/v1/ {
            proxy_set_header Host rhi-uat.localhost;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://rhi-uat-realtime:4000/socket/;
        }
        root /usr/share/nginx/html;
        location / { try_files $uri $uri/ /index.html; }
    }
}
