events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_max_body_size 50m;
    server {
        listen 8080;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        location = /__rhi/uat {
            default_type application/json;
            return 200 '{"environment":"rhi-isolated-uat","database":"rhi_uat_20261106","provider_delivery":false}';
        }
        location /auth/v1/ { proxy_pass http://rhi-uat-auth:9999/; }
        location /rest/v1/ { proxy_pass http://rhi-uat-rest:3000/; }
        location /storage/v1/ { proxy_pass http://rhi-uat-storage:5000/; }
        location /functions/v1/ { proxy_pass http://rhi-uat-functions:9000/; }
        location /realtime/v1/ {
            proxy_set_header Host rhi-uat.localhost;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://rhi-uat-realtime:4000/socket/;
        }
        root /usr/share/nginx/html;
        location / { try_files $uri $uri/ /index.html; }
    }
}
