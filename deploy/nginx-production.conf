# Public RHI ingress; install only after final synchronization and writer cutover.
map $http_upgrade $rhi_connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $rhi_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    /sw.js "no-cache, no-store, must-revalidate";
    ~^/workbox-[^/]+\.js$ "no-cache, no-store, must-revalidate";
}

map $uri $rhi_redirect {
    default "";
    ~^/(booking|payment-gateway-preview|login|dashboard|affiliates|leads|orders|schedule|map|profile|master-data|users|audit-logs)$ $uri/;
    /inventory /inventory/products;
}

server {
    listen 80;
    listen [::]:80;
    server_name rhi.polesheadlamp.id api-rhi.polesheadlamp.id;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rhi.polesheadlamp.id;
    ssl_certificate /etc/letsencrypt/live/rhi.polesheadlamp.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhi.polesheadlamp.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;


    root /var/www/rhi/current;
    index index.html;
    if ($rhi_redirect != "") { return 308 $rhi_redirect$is_args$args; }
    add_header Cache-Control $rhi_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'" always;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { try_files $uri =404; }
    location = /sw.js { try_files $uri =404; }
    location ~ /workbox-[^/]+\.js$ { try_files $uri =404; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; try_files $uri =404; }
    location ~ /\. { deny all; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-rhi.polesheadlamp.id;
    ssl_certificate /etc/letsencrypt/live/rhi.polesheadlamp.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhi.polesheadlamp.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/(auth|rest|storage|realtime|functions)/v1(?:/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rhi_connection_upgrade;
        proxy_read_timeout 180s;
    }
    # Studio/administrative routes are not published on the API host.
    location / { return 404; }
}
