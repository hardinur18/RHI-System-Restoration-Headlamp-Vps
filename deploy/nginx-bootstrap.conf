server {
    listen 80;
    listen [::]:80;
    server_name rhi.polesheadlamp.id api-rhi.polesheadlamp.id;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "RHI sedang disiapkan.\n";
    }
}
