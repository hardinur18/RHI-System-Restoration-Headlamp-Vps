# Layer after compose.staging.yml only at coordinated cutover.
# Public ingress is controlled separately by Nginx. Database/Studio remain private.
# Cron remains disabled until the source scheduler has been stopped and checked.
services:
  functions:
    environment:
      RHI_DEPLOYMENT_MODE: production
      # Owner deferred Google Ads and TikTok. Requires the tested scoped bundle.
      RHI_ADS_SYNC_PROVIDERS: meta
      # Bound reads during cold worker startup; 2.5s timed out in repeated UAT.
      KV_READ_TIMEOUT_MS: "8000"
    networks:
      function_isolation:
      function_egress:
networks:
  function_egress:
    driver: bridge
